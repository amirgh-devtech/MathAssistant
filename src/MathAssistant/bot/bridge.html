<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌉 AI Bridge Client</title>
    <style>
        :root {
            --bg: #1e1e2e;
            --surface: #2a2a3c;
            --text: #e0e0e0;
            --accent: #008B8B;
            --accent-hover: #006b6b;
            --error: #c0392b;
            --success: #27ae60;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: var(--surface);
            border-radius: 16px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 1.8rem;
            color: var(--accent);
        }
        .status-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            padding: 12px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #f39c12;
            transition: background 0.3s;
        }
        .dot.active {
            background: var(--success);
            animation: pulse 2s infinite;
        }
        .dot.error {
            background: var(--error);
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        .config-section {
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
        }
        .config-section label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        select, input[type="password"], input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #333;
            color: var(--text);
            font-size: 0.9rem;
        }
        .log {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 12px;
            height: 200px;
            overflow-y: auto;
            margin: 15px 0;
            font-size: 0.85rem;
            line-height: 1.4;
            font-family: 'Consolas', 'Monaco', monospace;
        }
        .log div {
            margin-bottom: 4px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 4px;
        }
        .log .timestamp {
            color: #888;
            margin-right: 10px;
        }
        .log .success { color: var(--success); }
        .log .error { color: var(--error); }
        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.9rem;
        }
        button:hover {
            background: var(--accent-hover);
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .note {
            font-size: 0.8rem;
            color: #aaa;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌉 Bridge Client</h1>
        <p style="text-align:center; margin-bottom:10px;">Connect to local server and forward requests to AI</p>

        <div class="status-indicator">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">Initializing...</span>
        </div>

        <div class="config-section">
            <label for="service">AI Service:</label>
            <select id="service">
                <option value="groq">Groq</option>
                <option value="openai">OpenAI</option>
                <option value="gemini">Gemini</option>
            </select>

            <label for="apiKey">API Key:</label>
            <input type="password" id="apiKey" placeholder="Enter your API key" autocomplete="off">

            <label for="model">Model (optional):</label>
            <input type="text" id="model" placeholder="Default for selected service">
        </div>

        <div class="buttons">
            <button id="startBtn">Start Polling</button>
            <button id="stopBtn" disabled>Stop</button>
        </div>

        <div class="log" id="logContainer"></div>

        <div class="note">
            Ensure the Flask bridge server is running on <code>http://127.0.0.1:5000</code>.
        </div>
    </div>

    <script>
        (function() {
            // ==================== CONFIGURATION ====================
            const BRIDGE_SERVER = 'http://127.0.0.1:5000';

            // Default API keys (optional - can be entered in UI)
            const DEFAULT_KEYS = {
                groq: '',
                openai: '',
                gemini: ''
            };

            // Default models (override in UI if needed)
            const DEFAULT_MODELS = {
                groq: 'mixtral-8x7b-32768',
                openai: 'gpt-3.5-turbo',
                gemini: 'gemini-1.5-flash'
            };

            // ==================== STATE ====================
            let isPolling = false;
            let pollTimeout = null;
            let processing = false;

            // DOM Elements
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const serviceSelect = document.getElementById('service');
            const apiKeyInput = document.getElementById('apiKey');
            const modelInput = document.getElementById('model');
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');
            const logContainer = document.getElementById('logContainer');

            // ==================== LOGGING ====================
            function addLog(message, type = 'info') {
                const timestamp = new Date().toLocaleTimeString();
                const div = document.createElement('div');
                div.innerHTML = `<span class="timestamp">[${timestamp}]</span> ${message}`;
                if (type === 'success') div.classList.add('success');
                if (type === 'error') div.classList.add('error');
                logContainer.appendChild(div);
                logContainer.scrollTop = logContainer.scrollHeight;
            }

            // ==================== STATUS ====================
            function setStatus(text, state = 'idle') {
                statusText.textContent = text;
                statusDot.className = 'dot';
                if (state === 'active') statusDot.classList.add('active');
                if (state === 'error') statusDot.classList.add('error');
            }

            // ==================== API FUNCTIONS ====================
            async function sendToGroq(prompt, apiKey, model) {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: [
                            { role: 'user', content: prompt }
                        ],
                        temperature: 0.7,
                        max_tokens: 4096
                    })
                });
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Groq API error (${response.status}): ${errorText}`);
                }
                const data = await response.json();
                return data.choices[0].message.content;
            }

            async function sendToOpenAI(prompt, apiKey, model) {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: [
                            { role: 'user', content: prompt }
                        ],
                        temperature: 0.7,
                        max_tokens: 4096
                    })
                });
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`OpenAI API error (${response.status}): ${errorText}`);
                }
                const data = await response.json();
                return data.choices[0].message.content;
            }

            async function sendToGemini(prompt, apiKey, model) {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [
                            {
                                parts: [{ text: prompt }]
                            }
                        ],
                        generationConfig: {
                            temperature: 0.7,
                            maxOutputTokens: 4096
                        }
                    })
                });
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Gemini API error (${response.status}): ${errorText}`);
                }
                const data = await response.json();
                if (data.candidates && data.candidates.length > 0) {
                    return data.candidates[0].content.parts[0].text;
                } else {
                    throw new Error('No response from Gemini');
                }
            }

            async function callAI(prompt, service, apiKey, model) {
                switch (service) {
                    case 'groq':
                        return await sendToGroq(prompt, apiKey, model);
                    case 'openai':
                        return await sendToOpenAI(prompt, apiKey, model);
                    case 'gemini':
                        return await sendToGemini(prompt, apiKey, model);
                    default:
                        throw new Error('Unknown service selected');
                }
            }

            // ==================== BRIDGE COMMUNICATION ====================
            async function pollBridge() {
                if (!isPolling) return;

                try {
                    const res = await fetch(`${BRIDGE_SERVER}/api/v1/request`);
                    const data = await res.json();

                    if (data.status === 'pending' && data.request && !processing) {
                        processing = true;
                        const request = data.request;
                        const requestId = request.id;
                        const prompt = request.payload;

                        addLog(`📥 Received request ${requestId.substring(0,8)}...`);
                        setStatus('Processing request...', 'active');

                        const service = serviceSelect.value;
                        const apiKey = apiKeyInput.value.trim() || DEFAULT_KEYS[service];
                        const model = modelInput.value.trim() || DEFAULT_MODELS[service];

                        if (!apiKey) {
                            addLog(`❌ No API key provided for ${service}`, 'error');
                            await sendErrorResponse(requestId, 'API key missing');
                        } else {
                            try {
                                const responseText = await callAI(prompt, service, apiKey, model);
                                addLog(`✅ Response received (${responseText.length} chars)`);
                                await sendSuccessResponse(requestId, responseText);
                                setStatus('Response sent back to bridge', 'active');
                            } catch (err) {
                                addLog(`❌ API error: ${err.message}`, 'error');
                                await sendErrorResponse(requestId, err.message);
                                setStatus('Error occurred', 'error');
                            }
                        }
                        processing = false;
                    }
                } catch (err) {
                    // Network error or server not reachable
                    addLog(`⚠️ Bridge server not reachable: ${err.message}`, 'error');
                    setStatus('Bridge server offline', 'error');
                }

                // Schedule next poll
                if (isPolling) {
                    pollTimeout = setTimeout(pollBridge, 1000);
                }
            }

            async function sendSuccessResponse(requestId, text) {
                try {
                    const res = await fetch(`${BRIDGE_SERVER}/api/v1/response`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            request_id: requestId,
                            response: text,
                            type: 'text'
                        })
                    });
                    if (!res.ok) {
                        addLog(`⚠️ Failed to send response to bridge: ${res.status}`, 'error');
                    }
                } catch (err) {
                    addLog(`⚠️ Error sending response: ${err.message}`, 'error');
                }
            }

            async function sendErrorResponse(requestId, errorText) {
                try {
                    const res = await fetch(`${BRIDGE_SERVER}/api/v1/response`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            request_id: requestId,
                            response: `❌ Bridge error: ${errorText}`,
                            type: 'error'
                        })
                    });
                    if (!res.ok) {
                        addLog(`⚠️ Failed to send error response: ${res.status}`, 'error');
                    }
                } catch (err) {
                    addLog(`⚠️ Error sending error response: ${err.message}`, 'error');
                }
            }

            // ==================== UI CONTROLS ====================
            startBtn.addEventListener('click', () => {
                if (isPolling) return;
                isPolling = true;
                startBtn.disabled = true;
                stopBtn.disabled = false;
                setStatus('Polling started', 'active');
                addLog('🚀 Polling started');
                pollBridge();
            });

            stopBtn.addEventListener('click', () => {
                isPolling = false;
                if (pollTimeout) clearTimeout(pollTimeout);
                startBtn.disabled = false;
                stopBtn.disabled = true;
                setStatus('Polling stopped');
                addLog('⏹️ Polling stopped');
            });

            // Auto-load saved values (optional)
            function loadConfig() {
                const savedService = localStorage.getItem('bridge_service');
                const savedApiKey = localStorage.getItem('bridge_api_key');
                const savedModel = localStorage.getItem('bridge_model');
                if (savedService) serviceSelect.value = savedService;
                if (savedApiKey) apiKeyInput.value = savedApiKey;
                if (savedModel) modelInput.value = savedModel;
            }

            function saveConfig() {
                localStorage.setItem('bridge_service', serviceSelect.value);
                localStorage.setItem('bridge_api_key', apiKeyInput.value);
                localStorage.setItem('bridge_model', modelInput.value);
            }

            serviceSelect.addEventListener('change', saveConfig);
            apiKeyInput.addEventListener('input', saveConfig);
            modelInput.addEventListener('input', saveConfig);

            // Initialize
            loadConfig();
            if (!apiKeyInput.value) {
                apiKeyInput.placeholder = `Enter ${serviceSelect.value} API key`;
            }

            // Test if bridge server is reachable on load
            fetch(`${BRIDGE_SERVER}/health`)
                .then(() => {
                    setStatus('Bridge server reachable', 'active');
                    addLog('✅ Connected to bridge server');
                })
                .catch(() => {
                    setStatus('Bridge server offline', 'error');
                    addLog('❌ Cannot reach bridge server. Start bridge_server.py first.', 'error');
                });
        })();
    </script>
</body>
</html>
